[project]
name = "boss"
version = "0.1.0"
description = "Route GitHub issues to coding agents that run in isolated containers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
boss = "boss.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs Docker and the boss-agent image; run with --docker"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
